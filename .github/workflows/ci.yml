name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test / clippy / fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add clippy rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      # The whole project is about not trusting a number you have not checked.
      # Running the suite on x86 as well as the ARM it is developed on is the
      # cheapest version of that: the SPSC queue's Release/Acquire pairing is
      # exactly the kind of code that passes on one memory model and fails on
      # the other, and CI runners are x86.
      - name: Report architecture
        run: uname -m

# fly.toml app configuration file generated for nanobook
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nanobook'
primary_region = 'iad'

[build]
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 8
    soft_limit = 4

[checks]
  [checks.health]
    port = 8080
    type = 'http'
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
